# Nextest configuration. `make test` runs nextest for the lib, workspace and
# process-isolated integration tests.

[profile.default]
test-threads = "num-cpus"

# Continue running tests even if some fail.
fail-fast = false

# Repeat captured failure details at the end so they remain visible after the
# remaining tests finish.
failure-output = "immediate-final"

# Mark tests as slow after 30s, terminate after 120s.
slow-timeout = { period = "30s", terminate-after = 4 }

# No retries: a test that passes on the second attempt is a flaky test, and
# retrying hides it.
retries = 0
