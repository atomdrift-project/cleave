# Nextest configuration for fast test execution
# Run with: cargo nextest run

[profile.default]
# Use all available CPUs for maximum parallelism
test-threads = "num-cpus"

# Continue running tests even if some fail
fail-fast = false

# Mark tests as slow after 30s, terminate after 120s
slow-timeout = { period = "30s", terminate-after = 4 }

# Retry flaky tests once
retries = 1

# Profile for CI - more aggressive timeouts
[profile.ci]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 0

# Profile for fast local development - skip slow tests
[profile.fast]
test-threads = "num-cpus"
fail-fast = true
# Filter out slow integration tests
# Run with: cargo nextest run --profile fast -E 'not test(/symbol_extraction|utf16|trait_strictness/)'
