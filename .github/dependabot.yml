# Actions in .github/workflows are pinned to commit SHAs so a moved tag can't
# swap the code we run. That only stays safe if the pins get refreshed, which
# is what this does — Dependabot rewrites the SHA and updates the trailing
# version comment.
#
# Cargo updates are grouped into one weekly PR. Git dependencies are pinned by
# `rev` in Cargo.toml and are bumped by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
