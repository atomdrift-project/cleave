[package]
name = "cleave"
version = "2.0.0-rc.6"
edition = "2024"
authors = ["The Atomdrift Project"]
description = "Deep static analysis tool for extracting features from binaries and source code"
license = "Apache-2.0"
default-run = "cleave"

[lints]
workspace = true

[workspace]
members = [".", "crates/scpt", "crates/malecule", "crates/sysmem", "crates/yara-classify", "crates/pyinstx", "crates/lzx", "cleave-macros"]

# Strict but pragmatic lints - similar to the Rust project itself
[workspace.lints.rust]
# Deny unsafe patterns and correctness issues
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"

[workspace.lints.clippy]
# Deny common mistakes and antipatterns
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Deny specific dangerous patterns
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# Deny poor error handling
result_unit_err = "deny"
result_large_err = "deny"

# Warn on code quality issues
missing_safety_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"

# Encourage idiomatic Rust
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"

# Catch reliability and safety issues not in clippy::all
dbg_macro = "deny"                      # dbg!() is never intentional in production
large_futures = "warn"                  # futures >16KB risk stack overflow on tokio workers
map_err_ignore = "warn"                 # .map_err(|_| ...) silently discards error context
wildcard_imports = "warn"               # explicit imports make it clear where names come from
significant_drop_in_scrutinee = "warn" # lock guard held through entire match scrutinee
significant_drop_tightening = "warn"   # suggests releasing locks earlier than current code does

# Allow pragmatic exceptions
# These are too noisy or conflict with readability
too_many_arguments = "warn"
type_complexity = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"  # Too strict for internal functions
missing_panics_doc = "allow"  # Too strict for internal functions

[dependencies]
# Procedural macros
cleave-macros = { path = "cleave-macros" }

# Single-pass file facts extractor.
# Owns every binary, archive-index, structured-document, and source-code
# parser cleave consumes. Goal: cleave never invokes goblin, zip, tar,
# tree-sitter, or the structured-format parsers directly — every parse
# is materialised once via filefacts::open() and reused via the typed
# views on `ParsedFile`.
filefacts = { git = "https://codeberg.org/atomdrift/filefacts.git" }

# Binary parsing — all goblin reads now go through filefacts's typed views.
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "std"] }
cfb = "0.10"  # Microsoft OLE2/CFBF compound document parsing
lnk = "0.6"  # Windows Shell Link (.lnk) parsing

# AppleScript parsing
scpt = { path = "crates/scpt" }

# Molecular visualization
malecule = { path = "crates/malecule" }

# System memory queries
sysmem = { path = "crates/sysmem" }

# PyInstaller archive extraction
pyinstx = { path = "crates/pyinstx" }

# YARA pattern matching
yara-classify = { path = "crates/yara-classify" }
yara-x = { version = "1.17", features = ["rules-profiling"] }

# Tree-sitter core types only. Per-language grammars (and their parsers)
# live in filefacts; cleave consumes the cached `tree_sitter::Tree`
# filefacts exposes via `ParsedFile::source_ast()`.
tree-sitter = "0.26"
streaming-iterator = "0.1"

# Serialization
plist = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
simd-json = "0.14"
toml = "1.1"
bincode = { package = "cu-bincode", git = "https://github.com/copper-project/cu-bincode", features = ["serde", "alloc", "std"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3.1"
terminal_size = "0.4"

# File operations
walkdir = "2.5"
zip = { version = "8.6", default-features = true }
sevenz-rust = { version = "0.6", features = ["aes256"] }
apple-xar = { version = "0.20", default-features = false }
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
xz2 = "0.1"
ar = "0.9"
cpio = "0.4"
zstd = "0.13"
unrar = "0.5"
cab = "0.6"
lzx = { path = "crates/lzx" }
rusqlite = { version = "0.33", features = ["bundled"] }

# Parallelization
rayon = "1.12"
# Stack growth for archive member tasks: a rayon worker blocked in a nested
# join steals unrelated pending tasks and runs them on top of its current
# stack, so frames from independent analyses compound without bound. maybe_grow
# moves a task onto a fresh heap segment when headroom runs low.
stacker = "0.1"

# Cryptography (for decrypting obfuscated payloads)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

# Utilities
sha2 = { version = "0.10", features = ["asm-aarch64"] }
md-5 = "0.10"
# RSA-PKCS1v15 verification — for cryptographic validation of PE
# Authenticode SignerInfo signatures against the leaf cert pubkey.
# Already a transitive dep via yara-x; pinning explicitly here.
rsa = "0.9"
# ECDSA verification (P-256, P-384) — for the ECDSA Authenticode case.
# Already transitive deps; pinning explicitly here.
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
# Non-crypto checksum for bound-import / build-host fingerprinting —
# u32 output fits cleanly into the metric integer model.
crc32fast = "1.5"
regex = "1.12"
regex-syntax = "0.8"  # For safe literal extraction from regex patterns (mandatory-atom extraction)
memchr = "2.8"
aho-corasick = "1.1"
rustc-hash = "2.1"
dashmap = "6.2"
lru = "0.12"  # LRU cache for UTF-8 conversion results
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
# Transitive-only (via plist/yara-x/sevenz-rust), pinned explicitly: `time`
# 0.3.48 added a `ModifierValue` projection impl that rustc 1.96 rejects as
# coherence-conflicting against any downstream blanket `From` impl (breaks
# yara-x, sevenz-rust, …). 0.3.47 is the newest release without it and still
# satisfies plist's `^0.3.47`. Drop this once a fixed `time` ships.
time = "=0.3.47"
hex = "0.4"
base64 = "0.22"
roxmltree = "0.21"
tempfile = "3.27"
filetime = "0.2"
strsim = "0.11"
dirs = "6.0"
semver = "1"  # Version comparison for the update notifier
# HTTPS client for the zero-telemetry update notice (plain GET of a static
# manifest; blocking so it stays off the async path). rustls-tls avoids a
# system OpenSSL dependency.
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
parking_lot = "0.12"  # Efficient mutexes/RwLocks. NOTE: `deadlock_detection` is opt-in (see the `deadlock-detection` feature) — it adds per-lock global-registry bookkeeping that has no place in release builds.
libc = "0.2"          # For FreeBSD sysctl thread info and other OS APIs
memmap2 = "0.9"  # Memory-mapped file I/O for large files
smallvec = "1.15"  # Stack-allocated vectors for small collections
encoding_rs = "0.8"  # Character encoding detection and conversion
stng = { git = "https://codeberg.org/atomdrift/stng.git" }  # String extraction

# Logging (tracing is the modern standard, more powerful than log+env_logger)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP server (for `cleave server` subcommand)
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "io-util", "sync"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["limit"] }
once_cell = "1.21"

[lib]
name = "cleave"
path = "src/lib.rs"

[[bin]]
name = "cleave"
path = "src/main.rs"
test = false  # Tests run via lib.rs - eliminates ~1700 duplicate tests

[features]
default = ["jemalloc"]
# Skip YARA rule loading in tests for faster execution
# Unit tests that don't need YARA scanning use this
test_fast = []
# Opt-in parking_lot deadlock detection (debug aid). OFF by default because it
# adds global lock-registry bookkeeping to every acquire/release. Build with:
# cargo build --features deadlock-detection
deadlock-detection = ["parking_lot/deadlock_detection"]
# Use jemalloc allocator for better memory management in long-running sessions.
# Prevents glibc malloc arena fragmentation that causes multi-GB RSS bloat
# when processing thousands of files across many rayon threads.
# Default on unix; disable with: cargo build --release --no-default-features
jemalloc = ["tikv-jemallocator", "tikv-jemalloc-ctl"]
# jemalloc with heap profiling support for memory leak diagnosis.
# Build with: cargo build --release --features jemalloc-prof
# Run with: MALLOC_CONF="prof:true,prof_active:true,lg_prof_interval:30,prof_prefix:out/heap/jeprof"
jemalloc-prof = ["jemalloc", "tikv-jemallocator/profiling"]
# Phase-tagged heap-growth accounting (src/mem_profile.rs). Reads jemalloc's
# per-thread allocated/deallocated counters at analysis-phase boundaries to
# attribute live-heap growth without symbol-based profiling. Diagnostic only.
# Build with: cargo build --release --features memprofile
memprofile = ["jemalloc"]

# jemalloc for unix-like systems (Linux, macOS).
# Excluded on FreeBSD/DragonFlyBSD where jemalloc is already the system allocator;
# bundling a second copy causes TSD assertion failures in jails. Excluded on
# OpenBSD whose jemalloc version string is incompatible with tikv-jemalloc-sys.
# Excluded on illumos/Solaris which ship libumem (a comparable arena allocator)
# and where tikv-jemalloc-sys's bundled config.sub doesn't recognize the host triple.
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["stats"] }

[dev-dependencies]
assert_cmd = "2.2"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.48", features = ["yaml"] }
once_cell = "1.21"  # For shared test initialization
predicates = "3.1"
proptest = "1.11"

[[bench]]
name = "analyze"
harness = false

# Thin LTO + cu=16 keeps most of fat LTO's runtime gain at roughly a
# third of the link time — the right default for everyday `cargo build
# --release`. Use the `release-lto` profile for container/distribution
# builds where the extra link minutes are acceptable.
[profile.release]
lto = "thin"
codegen-units = 16

# Distribution profile: fat LTO + single codegen unit. Squeezes out the
# last few percent of runtime at the cost of multi-minute link times.
# Used by `make release-lto` and the wolfi container builds.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.test]
opt-level = 1  # Faster test execution

[profile.dev]
opt-level = 0
debug = "line-tables-only"  # Faster builds, still debuggable

# Optimize heavy dependencies in debug builds for faster test execution
[profile.dev.package.yara-x]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

# Optimize the cleave crate itself in debug builds so integration tests
# (which spawn `target/debug/cleave` as a subprocess) don't pay 30s+ of
# unoptimized trait/capability init on every invocation.
[profile.dev.package.cleave]
opt-level = 3

# Trait/capability init parses 6490 YAML files into 35k+ regex traits on
# every cleave invocation — yaml + regex compile dominate subprocess startup.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.serde_yaml]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

