[package]
name = "pyinstx"
version = "0.1.0"
description = "Pure-Rust extractor for PyInstaller-bundled executables"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1.1"
memchr = "2.8"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
