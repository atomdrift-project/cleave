# JPEG Structural Anomalies
# JPEG entropy-coded data should not contain runs of null bytes
# Null byte patterns in JPEG compressed data suggest embedded non-image data

traits:
  # Basename filter to identify JPEG files when type detection says "unknown"
  - id: is-jpeg
    desc: JPEG file extension
    crit: component
    conf: 1.0
    for: [all]
    if:
      type: basename
      regex: '\.(jpe?g|jfif)$'

  # Null byte runs in binary data - component, only meaningful in image context
  - id: null-runs-in-stream
    desc: Null byte runs in compressed data
    crit: component
    conf: 0.8
    size_min: 4096
    for: [all]
    if:
      type: hex
      pattern: "00 00 00 00 00 00"
      offset_range: [512, null]

composite_rules:
  # JPEG with anomalous null byte runs - elevated by image context
  - id: jpeg-null-anomaly
    desc: JPEG image with anomalous null byte runs
    crit: notable
    conf: 0.8
    for: [all]
    all:
      - id: is-jpeg
      - id: null-runs-in-stream
