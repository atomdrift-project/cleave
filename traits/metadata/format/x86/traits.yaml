# x86 Binary Features
# x86/x64 instruction patterns and opcodes

defaults:
  for: [elf, pe, macho]

traits:
  # === Indirect Call Instructions ===
  - id: indirect-call-reg
    desc: Indirect call via register
    crit: baseline
    conf: 0.3
    if:
      type: hex
      pattern: "FF D?"
      count_min: 2

  - id: indirect-call-mem
    desc: Indirect call via memory
    crit: baseline
    conf: 0.3
    if:
      type: hex
      pattern: "FF 1?"
      count_min: 2

  # === CPU Feature Detection ===
  - id: cpuid-instr
    desc: CPUID instruction bytes
    crit: baseline
    conf: 0.3
    if:
      type: hex
      pattern: "0F A2"
      count_min: 1

  - id: xgetbv-instr
    desc: XGETBV instruction bytes
    crit: baseline
    conf: 0.3
    if:
      type: hex
      pattern: "0F 01 D0"
      count_min: 1

composite_rules:
  - id: cpuid-fingerprinting
    desc: CPUID feature detection
    crit: baseline
    conf: 0.4
    all:
      - id: cpuid-instr
      - id: xgetbv-instr
