traits:
  - id: js-umd-wrapper
    desc: Universal Module Definition (UMD) wrapper
    crit: baseline
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: raw
      regex: typeof\s*exports\s*===\s*["']object["']
  - id: js-umd-wrapper-amd
    desc: UMD AMD branch marker
    crit: baseline
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: raw
      regex: typeof\s*define\s*===\s*["']function["']\s*&&\s*define\.amd
  - id: js-webpack-bundle
    desc: Webpack bundled JavaScript module
    crit: baseline
    conf: 0.95
    for:
      - javascript
    if:
      type: raw
      substr: __webpack_require__
composite_rules:
  - id: js-umd-wrapper-any
    desc: Universal Module Definition (UMD) wrapper
    crit: baseline
    conf: 0.9
    any:
      - id: js-umd-wrapper
      - id: js-umd-wrapper-amd
