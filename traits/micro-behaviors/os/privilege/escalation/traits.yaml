# Windows Privilege Operations
# Token and privilege escalation related APIs

defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]

traits:
  # === Token Access ===
  - id: open-process-token
    desc: Open process access token
    crit: notable # Downgraded from suspicious - common in installers
    conf: 0.75
    if:
      type: symbol
      exact: "OpenProcessToken"
    downgrade:
      any:
        - type: string
          substr: "ApiSet Stub DLL"

  # === Privilege Operations ===
  - id: lookup-privilege-value
    desc: Lookup privilege name to LUID
    crit: notable # Downgraded from suspicious - common in installers
    conf: 0.75
    if:
      type: symbol
      exact: "LookupPrivilegeValueW"
    downgrade:
      any:
        - type: string
          substr: "ApiSet Stub DLL"

  - id: adjust-token-privileges
    desc: Enable/disable privileges in access token
    crit: notable # Downgraded from suspicious - common in installers
    conf: 0.80
    if:
      type: symbol
      exact: "AdjustTokenPrivileges"
    downgrade:
      any:
        - type: string
          substr: "ApiSet Stub DLL"

  # === Token Query ===
  - id: get-token-information
    desc: Query token information
    crit: baseline
    conf: 0.65
    if:
      type: symbol
      exact: "GetTokenInformation"

  - id: duplicate-token
    desc: Create duplicate of access token
    crit: notable
    conf: 0.80
    if:
      type: symbol
      exact: "DuplicateTokenEx"

  # === UAC Elevation ===
  - id: runas-verb
    desc: ShellExecute runas verb for elevation
    crit: suspicious
    conf: 0.9
    if:
      type: string
      exact: "runas"
      section: text

composite_rules:
  - id: token-spawn-api-chain
    desc: Token duplication and user-context process spawn chain
    crit: suspicious
    conf: 0.88
    attack: "T1134"
    all:
      - id: open-process-token
      - id: duplicate-token
      - id: micro-behaviors/process/create/spawn::create-process-as-user
