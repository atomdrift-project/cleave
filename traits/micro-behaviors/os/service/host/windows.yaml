# Windows Service Host Interaction
# Detects linking to system libraries used for service management

defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: advapi32-link
    desc: Links to ADVAPI32.dll (Service Management)
    crit: baseline
    conf: 1.0
    if:
      type: symbol
      exact: "DeregisterEventSource"

  - id: service-dll-value-name
    desc: ServiceDll registry value marker
    crit: suspicious
    conf: 0.9
    if:
      type: string
      exact: "servicedll"
      case_insensitive: true

  - id: system32-service-dll-target
    desc: Service DLL path under System32
    crit: notable
    conf: 0.85
    if:
      type: string
      regex: "%SystemRoot%\\\\System32\\\\"
