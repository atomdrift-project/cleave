# Mutex Operations - Windows
# MBC: C0042 (Mutex)
#
# Mutex (mutual exclusion) objects are used for synchronization.
# Malware commonly uses global mutexes for single-instance enforcement
# to prevent multiple infections.

defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: "C0042"

traits:
  - id: create-mutex
    desc: CreateMutex API call
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      regex: 'CreateMutex[AW]?$'

  - id: create-mutex-ex
    desc: CreateMutexEx API call (extended)
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      regex: 'CreateMutexEx[AW]?$'

  - id: open-mutex
    desc: OpenMutex API call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: 'OpenMutex[AW]?$'

  - id: release-mutex
    desc: ReleaseMutex API call
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: 'ReleaseMutex'

  # === Global mutex patterns ===
  - id: global-prefix
    desc: Global namespace mutex prefix
    crit: notable
    conf: 0.8
    if:
      type: string
      regex: '(?i)^Global\\\\'

  - id: local-prefix
    desc: Local namespace mutex prefix
    crit: baseline
    conf: 0.7
    if:
      type: string
      regex: '(?i)^Local\\\\'

  # === Suspicious mutex naming patterns ===
  # NOTE: Random mutex name detection removed - pattern too broad and matches
  # legitimate function names. Use GUID pattern instead for mutex identification.

  - id: guid-mutex
    desc: GUID-formatted mutex name
    crit: notable
    conf: 0.8
    if:
      type: string
      regex: '\{[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\}'

composite_rules:
  - id: mutex-api
    desc: Mutex creation/access API
    crit: baseline
    conf: 0.85
    any:
      - id: create-mutex
      - id: create-mutex-ex
      - id: open-mutex

  - id: global-mutex-single-instance
    desc: Global mutex for single instance check
    crit: notable
    conf: 0.85
    all:
      - id: global-prefix
    any:
      - id: create-mutex
      - id: open-mutex

  - id: mutex-instance-check
    desc: Mutex-based single instance enforcement
    crit: notable
    conf: 0.8
    all:
      - id: mutex-api
    any:
      - id: micro-behaviors/process/terminate/kill::exit-process
      - id: micro-behaviors/os/error-handling/exceptions::get-last-error
