# Timing-Based Anti-Analysis - Windows
# ATT&CK: T1497.003 (Virtualization/Sandbox Evasion: Time Based Evasion)
# MBC: B0003.003 (Time Based Evasion)
#
# Composite rules that combine timing APIs with other anti-analysis
# indicators to detect evasion intent.

defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1497.003"
  mbc: "B0003.003"

composite_rules:
  - id: high-res-timing
    desc: High-resolution timing API usage
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/time/timing/delay::query-performance-counter
      - id: objectives/anti-analysis/timing/evasion::rdtsc
      - id: micro-behaviors/time/timing/check::get-system-time-precise

  - id: timing-delta-check
    desc: Multiple timing calls (delta measurement)
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: micro-behaviors/os/time/query::get-tick-count
      - id: micro-behaviors/time/timing/delay::query-performance-counter
      - id: micro-behaviors/time/timing/check::timegettime
      - id: objectives/anti-analysis/timing/evasion::rdtsc

  - id: timing-anti-debug
    desc: Timing-based anti-debugging pattern
    crit: notable
    conf: 0.9
    all:
      - id: high-res-timing
    any:
      - id: objectives/anti-analysis/debugger/detect::debugger-api
      - id: micro-behaviors/process/terminate/kill::exit-process
    downgrade:
      any:
        - type: section
          substr: '.aspr'
        - id: metadata/vendor/microsoft::openmp-runtime
        - id: metadata/quality/versioning::pe-version-resource
        - id: metadata/lang/compiler::msvc
        - id: metadata/signed/platform::microsoft
        - id: metadata/vendor/microsoft::is-microsoft-named
        - id: metadata/vendor/microsoft::is-windows-named

  - id: timing-sandbox-evasion
    desc: Timing-based sandbox evasion
    crit: suspicious
    conf: 0.85
    all:
      - id: timing-delta-check
    any:
      - id: objectives/anti-analysis/vm/detect
      - id: objectives/anti-analysis/sandbox/detect
    downgrade:
      any:
        - type: section
          substr: '.aspr'
        - id: metadata/vendor/microsoft::openmp-runtime
        - id: metadata/quality/versioning::pe-version-resource
        - id: metadata/lang/compiler::msvc
        - id: metadata/lang/compiler::clang-string
        - id: metadata/format/extension::py
        - id: metadata/signed/platform::microsoft
        - id: metadata/vendor/microsoft::is-microsoft-named
        - id: metadata/vendor/microsoft::is-windows-named
        - id: metadata/format::large-executable
        - id: metadata/format::many-imports
