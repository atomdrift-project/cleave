# CPUID Instruction Detection
# Used for hypervisor/VM detection

defaults:
  crit: notable
  conf: 0.9

traits:
  - id: cpuid-instruction
    desc: CPUID instruction (hypervisor fingerprinting)
    crit: notable
    conf: 0.95
    for: [pe, elf, macho]
    count_min: 2
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: "0F A2"
