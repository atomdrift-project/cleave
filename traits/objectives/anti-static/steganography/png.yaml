# PNG Steganography Detection
# MBC: E1027.003 (Steganography)
# ATT&CK: T1027.003 (Obfuscated Files or Information: Steganography)
#
# Detects PNG images that likely contain hidden payloads based on:
# - High pixel entropy (random-looking data)
# - Flat color histogram (uniform distribution vs natural images)
# - Lack of visual structure (no edges/gradients)
# - Random-looking filename patterns

defaults:
  for: [png]
  attack: "T1027.003"
  mbc: "E1027.003"

traits:
  # Per-channel entropy is the key indicator for steganography
  # When data is encoded in pixel bytes, each channel has near-maximal entropy
  # Normal images: 5-7 bits per channel, Steganographic: 7.9+ bits
  - id: high-red-channel-entropy
    desc: Very high red channel entropy
    crit: suspicious
    conf: 0.9
    if:
      type: metrics
      field: png.r_entropy
      min: 7.9

  - id: high-green-channel-entropy
    desc: Very high green channel entropy
    crit: suspicious
    conf: 0.9
    if:
      type: metrics
      field: png.g_entropy
      min: 7.9

  - id: high-blue-channel-entropy
    desc: Very high blue channel entropy
    crit: suspicious
    conf: 0.9
    if:
      type: metrics
      field: png.b_entropy
      min: 7.9

  # Overall pixel entropy (interleaved channels) is still informative
  # but per-channel is more reliable
  - id: high-pixel-entropy
    desc: Very high pixel data entropy
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: png.pixel_entropy
      min: 6.5

  # Flat histogram = uniform random distribution (not natural image)
  # histogram_flatness is normalized entropy: 1.0 = perfectly uniform
  - id: uniform-color-distribution
    desc: Suspiciously flat color histogram
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: png.histogram_flatness
      min: 0.8

  # High edge density in noise images - random adjacent pixels often differ
  # Real images have structured edges, noise has chaotic "edges" everywhere
  # Normal images: 0.1-0.4, Pure noise: 0.6-0.8
  - id: noise-like-edge-pattern
    desc: Chaotic noise-like edge pattern
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: png.edge_density
      min: 0.6

  # Random-looking filename pattern (machine-generated)
  - id: random-filename
    desc: Machine-generated filename pattern
    crit: notable
    conf: 0.7
    if:
      type: basename
      regex: "^[a-z0-9]{8,16}\\.(png|jpg|gif|bmp)$"

  # Poor compression ratio - random data doesn't compress well
  # Normal PNG compression ratio: 0.3-0.7
  # Noise/random data: 0.8-1.1 (nearly uncompressible)
  - id: poor-compression-ratio
    desc: Unusual compression ratio for noise
    crit: notable
    conf: 0.65
    if:
      type: metrics
      field: png.compression_ratio
      min: 0.8

composite_rules:
  # Primary steganography detection: all RGB channels have near-maximal entropy
  # This is the strongest indicator - real images never have this pattern
  - id: steganographic-payload
    desc: PNG likely contains hidden data
    crit: hostile
    conf: 0.98
    attack: "T1027.003"
    mbc: "E1027.003"
    all:
      - id: high-red-channel-entropy
      - id: high-green-channel-entropy
      - id: high-blue-channel-entropy

  # Secondary detection: noise-like image characteristics
  - id: noise-image-payload
    desc: Pure noise image (likely steganographic)
    crit: suspicious
    conf: 0.9
    attack: "T1027.003"
    mbc: "E1027.003"
    all:
      - id: uniform-color-distribution
      - id: noise-like-edge-pattern
    any:
      - id: random-filename
      - id: poor-compression-ratio
