traits:
  - id: custom-pe-loader
    desc: Manual PE header verification and parsing
    crit: suspicious
    conf: 0.9
    mbc: "B0005" # Reflective Code Loading
    for: [pe, dll]
    if:
      type: hex
      # Patterns for MZ header check, e_lfanew offset (0x3c), and PE header check
      pattern: "66 81 ?? 4d 5a 75 ?? ?? ?? ?? 3c ?? ?? ?? ?? ?? 50 45 00 00"
    unless:
      # MinGW/GCC runtime includes PE validation for module loading
      - type: string
        substr: "PyInit_"
      # MSVC runtime PE validation
      - type: string
        substr: "VS_VERSION_INFO"
