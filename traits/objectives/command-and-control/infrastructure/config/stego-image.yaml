# Steganographic C2 Configuration in Image Files
# Detects image files used as binary configuration carriers for C2 infrastructure
# ATT&CK: T1027.003 (Steganography), T1001.002 (Steganography in C2)

composite_rules:
  # Image file with embedded network structures = C2 config carrier
  # Requires: JPEG basename + null byte anomaly + AF_INET sockaddr_in structures
  - id: image-c2-config
    desc: Image with embedded network configuration structures
    crit: suspicious
    conf: 0.9
    for: [all]
    attack: "T1027.003"
    mbc: "B0032"
    all:
      - id: metadata/format/jpeg::jpeg-null-anomaly
    any:
      - id: micro-behaviors/data/embedded/network::sockaddr-in-nullpad-be
      - id: micro-behaviors/data/embedded/network::sockaddr-in-nullpad-le
