# Telegram Desktop Credential Access
# Detection of Telegram data directory and session file access
# ATT&CK: T1555 (Credentials from Password Stores)

defaults:
  for: [all]
  crit: notable
  conf: 0.85
  attack: "T1555"

traits:
  - id: desktop-path
    desc: Telegram Desktop directory reference
    if:
      type: string
      substr: Telegram Desktop

  - id: tdata-directory
    desc: Telegram tdata directory access
    crit: suspicious
    conf: 0.9
    if:
      type: string
      substr: tdata

  - id: tdata-path
    desc: Telegram tdata full path
    crit: suspicious
    conf: 0.95
    if:
      type: string
      regex: 'Telegram Desktop[/\\]+tdata'

  - id: map-file
    desc: Telegram map files
    if:
      type: string
      regex: 'map[0-9]+'

  - id: d877f783-file
    desc: Telegram D877F783 session directory
    crit: suspicious
    conf: 0.9
    if:
      type: string
      substr: D877F783

composite_rules:
  - id: telegram-stealer
    desc: Telegram session stealer detected
    crit: suspicious
    conf: 0.95
    attack: "T1555"
    for: [all]
    all:
      - id: desktop-path
    any:
      - id: tdata-directory
      - id: tdata-path
      - id: objectives/collection/messaging/app::telegram-key-datas
