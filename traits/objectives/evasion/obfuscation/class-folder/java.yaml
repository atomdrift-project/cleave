composite_rules:
  - id: kingdavid-rat
    description: "Detects the KingDavid RAT, which uses Caesium obfuscation with the 'class folder' technique."
    criticality: hostile
    conf: 1.0
    all:
      - id: micro-behaviors/anti-static/obfuscation/archive::java-archive-slashed-class-folder
    any:
      - id: micro-behaviors/data/meta/format/obfuscator::caesium-debug
      - id: micro-behaviors/data/meta/format/obfuscator::kingdavid-main-class
      - id: well-known/malware/rat/caesium::caesium-rat-config-marker
