defaults:
  for: [javascript, typescript]

composite_rules:
  - id: js-fetch-eval-dropper
    desc: "Remote code execution via HTTP fetch and eval"
    crit: hostile
    conf: 0.95
    attack: "T1105"
    mbc: "B0024"
    all:
      - id: micro-behaviors/communications/http/request::http-client-usage
      - id: well-known/malware/dropper::code-execution-methods
    size_max: 50000
