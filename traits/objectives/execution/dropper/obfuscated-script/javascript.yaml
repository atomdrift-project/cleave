defaults:
  for: [javascript, typescript]

composite_rules:
  - id: obfuscated-jscript-dropper
    desc: "Obfuscated JScript dropper behavior (conditional compilation + eval + string manipulation)"
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/execution/interpreter/scripting/jscript::jscript-cc-eval
    any:
      - id: objectives/anti-static/obfuscation/source/syntax::js-split-string-property
      - id: objectives/anti-static/obfuscation/code-metrics/structure::very-long-lines
      - id: objectives/anti-static/obfuscation/source/syntax::js-comma-sequence-obfuscation-v2
    needs: 1
    attack: "T1027"
    mbc: "B0032"

  - id: jscript-obfuscated-bat-dropper
    desc: "Obfuscated JScript dropper executing batch script"
    crit: hostile
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/execution/interpreter/scripting/jscript::jscript-cc-on
      - id: micro-behaviors/process/create/script::batch-script-execution
    any:
      - id: micro-behaviors/anti-static/obfuscate/string-conceal::js-createobject-reversed
      - id: micro-behaviors/anti-static/obfuscate/string-conceal::js-adodb-savetofile-reversed
      - id: micro-behaviors/anti-static/obfuscate/string-conceal::js-xmlhttp-responsebody-reversed
    needs: 1
    attack: "T1059.003"
    mbc: "E1100"
