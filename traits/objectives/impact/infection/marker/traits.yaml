# Impact - Infection Markers
# ATT&CK: T1204 (User Execution)

traits:
  - id: infected-with
    desc: Infection notification pattern
    crit: suspicious
    conf: 0.9
    attack: "T1204"
    for: [all]
    if:
      type: string
      regex: ".{3,16} infected with .{3,16}"

  - id: elf-infector-yara
    desc: ELF file infector pattern via
    crit: suspicious
    conf: 0.95
    attack: "T1204"
    mbc: "B0009"
    for: [elf]
    if:
      type: yara
      source: |
        rule elf_infector {
          strings:
            // High-confidence infection terminology (specific to file infectors)
            $infect_file = /infect.{0,10}(file|elf|binary)/i
            $virus = "virus" nocase fullword
            $parasite = "parasite" nocase fullword
            // Common file-scanning patterns in infectors - require word boundaries
            // Use \b to avoid matching "scanner self" or "scanning elf"
            $scan_elf = /\bscan[_\s]+(for[_\s]+)?elf\b/i
            $find_target = /find.{0,10}target/i
            // Exclusions for legitimate binaries/tools
            $llvm = "LLVM" fullword
            $clang = "clang" fullword
            $objcopy = "objcopy" fullword
            $binutils = "binutils" fullword
            // Lexer/parser generators
            $flex = "flex" fullword
            $lex = " lex " nocase
            $yacc = "yacc" fullword
            $bison = "bison" fullword
            $scanner = "scanner" nocase fullword
          condition:
            uint32(0) == 0x464C457F and
            filesize < 1MB and
            // Only match explicit infection terminology, NOT embedded ELF
            // (embedded ELF is common in linkers, objcopy, etc.)
            any of ($infect_file, $virus, $parasite, $scan_elf, $find_target) and
            none of ($llvm, $clang, $objcopy, $binutils, $flex, $lex, $yacc, $bison, $scanner)
        }

  # === XOR-encoded infection marker atomic indicators ===
  - id: infected-xor
    desc: XOR-encoded infected string
    crit: component
    for: [binaries]
    if:
      type: encoded
      encoding: xor
      word: "infected"
      case_insensitive: true

  - id: virus-xor
    desc: XOR-encoded virus string
    crit: component
    for: [binaries]
    if:
      type: encoded
      encoding: xor
      word: "virus"

  - id: trojan-xor
    desc: XOR-encoded trojan string
    crit: component
    for: [binaries]
    if:
      type: encoded
      encoding: xor
      word: "trojan"

  - id: worm-xor
    desc: XOR-encoded worm string
    crit: component
    for: [binaries]
    if:
      type: encoded
      encoding: xor
      word: "worm"

  - id: malware-xor
    desc: XOR-encoded malware string
    crit: component
    for: [binaries]
    if:
      type: encoded
      encoding: xor
      word: "malware"

  - id: win-error-virus
    desc: Windows ERROR_VIRUS_INFECTED constant
    crit: component
    for: [binaries]
    if:
      type: string
      substr: "ERROR_VIRUS_INFECTED"

composite_rules:
  # XOR-encoded malware type indicators
  - id: malware-type-xor
    desc: XOR-encoded malware type string
    crit: component
    for: [binaries]
    any:
      - id: virus-xor
      - id: trojan-xor
      - id: worm-xor
      - id: malware-xor

  # XOR-encoded infection markers composite
  - id: infected-xor-pattern
    desc: XOR obfuscated infection marker pattern
    crit: suspicious
    conf: 0.95
    attack: "T1027"
    for: [binaries]
    size_max: 5242880
    all:
      - id: infected-xor
      - id: malware-type-xor
    none:
      - id: win-error-virus

  # NOTE: Simple libc function references are too common in statically linked binaries
  # Require explicit infection markers or embedded ELF payloads at non-zero offset
