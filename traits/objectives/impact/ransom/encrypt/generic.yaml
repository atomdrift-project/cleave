# Ransomware Detection
# MBC: B0040 (Encryption for Impact)
# ATT&CK: T1486

defaults:
  for: [all]

traits:
  - id: encrypt
    desc: Ransomware encryption patterns
    crit: suspicious
    conf: 0.75
    mbc: "B0040"
    attack: "T1486"
    if:
      type: yara
      source: |
        rule ransomware {
          strings:
            // Ransom-specific terms (not generic crypto)
            $ransom1 = "ransom" nocase fullword
            $ransom2 = "your files have been encrypted" nocase
            $ransom3 = "pay to decrypt" nocase
            $ransom4 = "files will be deleted" nocase
            // Payment indicators
            $tor = "torproject.org"
            $onion = /[a-z2-7]{16,56}\.onion/
            $btc_addr = /[13][a-km-zA-HJ-NP-Z1-9]{25,34}/
            $btc_pay = "bitcoin" nocase fullword
            // File extension indicators
            $ext_locked = ".locked" ascii
            $ext_encrypted = ".encrypted" ascii
            $ext_crypto = ".crypto" ascii
            
            // False Positive Reduction
            $fp_et = "doc.emergingthreats.net" nocase
            $fp_elastic = "securitySolution" nocase
            $fp_signatures = "signatures" nocase fullword
          condition:
            filesize < 25MB and (
              (any of ($ransom2, $ransom3) or
              ($ransom4 and ($ransom1 or $tor or $onion or any of ($btc*) or $btc_pay)) or
              ($ransom1 and ($tor or $onion or any of ($btc*) or any of ($ext_*))) or
              ($tor and $btc_pay) or
              (any of ($ext_*) and $btc_pay) or
              ($onion and any of ($btc*)))
            ) and not any of ($fp_*)
        }

  - id: encrypt-decryptor-msg-1
    desc: References decryptor (your/run/download)
    crit: notable
    conf: 0.7
    if:
      type: string
      regex: "\\b(your|run|download)\\s+decryptor"
      case_insensitive: true

  - id: encrypt-decryptor-msg-2
    desc: References decryptor (get/free)
    crit: notable
    conf: 0.7
    if:
      type: string
      regex: "\\b(get|free)\\s+decryptor"
      case_insensitive: true

  - id: encrypt-decryptor-file
    desc: References decryptor file (exe/bin/bat)
    crit: notable
    conf: 0.75
    if:
      type: string
      regex: "decryptor\\.(exe|bin|bat)"
      case_insensitive: true

  # Go file encryption patterns (ransomware) - atomic indicators
  - id: go-crypto-aes
    desc: Go crypto/aes import
    crit: component
    conf: 0.8
    for: [go]
    if:
      type: string
      substr: "crypto/aes"

  - id: go-crypto-cipher
    desc: Go crypto/cipher import
    crit: component
    conf: 0.8
    for: [go]
    if:
      type: string
      substr: "crypto/cipher"

  - id: go-crypto-rsa
    desc: Go crypto/rsa import
    crit: component
    conf: 0.8
    for: [go]
    if:
      type: string
      substr: "crypto/rsa"


composite_rules:
  - id: encrypt-decryptor
    desc: References decryptor
    crit: suspicious
    conf: 0.66
    any:
      - id: encrypt-decryptor-msg-1
      - id: encrypt-decryptor-msg-2
      - id: encrypt-decryptor-file

  # Go file encryption composites
  - id: go-crypto-any
    desc: Go crypto library usage
    crit: component
    for: [go]
    any:
      - id: go-crypto-aes
      - id: go-crypto-cipher
      - id: go-crypto-rsa

  - id: go-writefile-any
    desc: Go file write functions
    crit: component
    for: [go]
    any:
      - id: micro-behaviors/fs/file/operations::ioutil-write-file
      - id: micro-behaviors/fs/file/operations::os-write-file

  - id: go-write-or-ext
    desc: Go file write or ransom extension
    crit: component
    for: [go]
    any:
      - id: go-writefile-any
      - id: objectives/impact/ransomware/behavior::encrypted-extensions

  - id: go-file-encrypt
    desc: Go file encryption patterns (ransomware)
    crit: suspicious
    conf: 0.8
    for: [go]
    mbc: "B0040"
    attack: "T1486"
    all:
      - id: go-crypto-any
      - id: objectives/impact/wiper/disk::go-walk-capability
      - id: go-write-or-ext

  - id: encrypt-note
    desc: Ransom note patterns
    crit: notable
    conf: 0.66
    any:
      - id: micro-behaviors/data/text/malware/
