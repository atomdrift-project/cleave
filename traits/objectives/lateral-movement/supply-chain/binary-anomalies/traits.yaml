# Supply Chain - Binary Anomalies
# Detects suspicious binary files embedded in script-based packages
# NPM and Python packages shouldn't normally contain .exe, .dll files

defaults:
  for: [all]

traits:
  # === Package file detection by filename (for archive context) ===
  - id: archive-has-package-json
    desc: Archive contains package.json file
    crit: component
    conf: 0.95
    if:
      type: basename
      exact: package.json

  - id: archive-has-setup-py
    desc: Archive contains setup.py file
    crit: component
    conf: 0.95
    if:
      type: basename
      exact: setup.py

  - id: archive-has-pyproject-toml
    desc: Archive contains pyproject.toml file
    crit: component
    conf: 0.95
    if:
      type: basename
      exact: pyproject.toml

  # === Binary file detection in archive context ===
  - id: archive-has-exe
    desc: Archive contains Windows executable (.exe)
    crit: component
    conf: 0.95
    if:
      type: basename
      regex: '\.exe$'
      case_insensitive: true

  - id: archive-has-dll
    desc: Archive contains Windows DLL (.dll)
    crit: component
    conf: 0.95
    if:
      type: basename
      regex: '\.dll$'
      case_insensitive: true

  - id: archive-has-so
    desc: Archive contains Linux shared object (.so)
    crit: component
    conf: 0.95
    if:
      type: basename
      regex: '\.so(\.[0-9]+)*$'

  - id: archive-has-dylib
    desc: Archive contains macOS dynamic library (.dylib)
    crit: component
    conf: 0.95
    if:
      type: basename
      regex: '\.dylib$'

  - id: archive-has-png
    desc: Archive contains PNG image
    crit: component
    conf: 0.9
    if:
      type: basename
      regex: '\.png$'
      case_insensitive: true

  - id: archive-has-ico
    desc: Archive contains ICO icon file
    crit: component
    conf: 0.9
    if:
      type: basename
      regex: '\.ico$'
      case_insensitive: true

composite_rules:
  # === NPM Package with Binaries (container-level cross-file detection) ===
  - id: npm-package-with-exe
    desc: NPM package contains Windows executable
    crit: suspicious
    conf: 0.9
    all:
      - id: archive-has-package-json
    any:
      - id: archive-has-exe

  - id: npm-package-with-dll
    desc: NPM package contains Windows DLL
    crit: suspicious
    conf: 0.9
    all:
      - id: archive-has-package-json
    any:
      - id: archive-has-dll

  - id: npm-package-with-native-binary
    desc: NPM package contains native binary (exe/dll/so/dylib)
    crit: suspicious
    conf: 0.85
    all:
      - id: archive-has-package-json
    any:
      - id: archive-has-exe
      - id: archive-has-dll
      - id: archive-has-so
      - id: archive-has-dylib

  - id: npm-package-with-image
    desc: NPM package contains PNG image (potential steganography)
    crit: notable
    conf: 0.7
    all:
      - id: archive-has-package-json
    any:
      - id: archive-has-png
      - id: archive-has-ico

  # === Python Package with Binaries (container-level cross-file detection) ===
  - id: python-package-with-exe
    desc: Python package contains Windows executable
    crit: suspicious
    conf: 0.9
    all:
      - id: archive-has-setup-py
    any:
      - id: archive-has-exe

  - id: python-package-with-exe-pyproject
    desc: Python package (pyproject.toml) contains Windows executable
    crit: suspicious
    conf: 0.9
    all:
      - id: archive-has-pyproject-toml
    any:
      - id: archive-has-exe

  - id: python-package-with-dll
    desc: Python package contains Windows DLL
    crit: suspicious
    conf: 0.9
    all:
      - id: archive-has-setup-py
    any:
      - id: archive-has-dll

  - id: python-package-with-dll-pyproject
    desc: Python package (pyproject.toml) contains Windows DLL
    crit: suspicious
    conf: 0.9
    all:
      - id: archive-has-pyproject-toml
    any:
      - id: archive-has-dll

  - id: python-package-with-native-binary
    desc: Python package contains native binary (exe/dll)
    crit: suspicious
    conf: 0.85
    any:
      - id: python-package-with-exe
      - id: python-package-with-exe-pyproject
      - id: python-package-with-dll
      - id: python-package-with-dll-pyproject

  - id: python-package-with-image
    desc: Python package contains PNG image (potential steganography)
    crit: notable
    conf: 0.7
    all:
      - id: archive-has-setup-py
    any:
      - id: archive-has-png
      - id: archive-has-ico

  # === Combined package binary detection ===
  - id: script-package-with-windows-binary
    desc: Script-based package contains Windows binary (highly suspicious)
    crit: suspicious
    conf: 0.9
    any:
      - id: npm-package-with-exe
      - id: npm-package-with-dll
      - id: python-package-with-exe
      - id: python-package-with-exe-pyproject
      - id: python-package-with-dll
      - id: python-package-with-dll-pyproject
