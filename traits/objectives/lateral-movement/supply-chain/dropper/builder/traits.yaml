# Dropper Builder Patterns
# Detects tools that generate malicious batch files, JScript droppers, etc.
# ATT&CK: T1027.002 (Software Packing)
# MBC: F0001 (Obfuscated Files or Information)

defaults:
  for: [all]

traits:
  # exe-to-batch builder components
  - id: encodebytes-py
    desc: encodebytes function
    crit: component
    for: [python]
    if:
      type: string
      substr: "encodebytes"

  - id: echo-off-batch
    desc: "echo off batch command"
    crit: component
    if:
      type: string
      substr: "@echo off"
      case_insensitive: true

  - id: echo-percent
    desc: "echo percent batch pattern"
    crit: component
    if:
      type: string
      substr: "echo %"

  - id: bat-ext
    desc: .bat extension
    crit: component
    if:
      type: string
      substr: ".bat"

  - id: cmd-ext
    desc: .cmd extension
    crit: component
    if:
      type: string
      substr: ".cmd"

  - id: js-ext
    desc: .js extension
    crit: component
    if:
      type: string
      substr: ".js"

  - id: vbs-ext
    desc: .vbs extension
    crit: component
    if:
      type: string
      substr: ".vbs"

  - id: open-paren
    desc: open() function call
    crit: component
    for: [python]
    if:
      type: string
      substr: "open("

  - id: rb-mode
    desc: "rb read binary mode"
    crit: component
    for: [python]
    if:
      type: string
      exact: rb

  # jscript dropper components
  - id: adodb-stream-str
    desc: ADODB.Stream string
    crit: component
    if:
      type: string
      substr: "ADODB.Stream"

  - id: msxml2-str
    desc: MSXml2 string
    crit: component
    if:
      type: string
      substr: "MSXml2"

  # python marshal components
  - id: marshal-loads-import
    desc: from marshal import loads
    crit: component
    for: [python]
    if:
      type: string
      substr: "from marshal import loads"

  - id: exec-paren
    desc: exec() call
    crit: component
    for: [python, javascript, typescript]
    if:
      type: string
      substr: "exec("

  - id: loads-b
    desc: loads(b prefix
    crit: component
    for: [python]
    if:
      type: string
      substr: "loads(b"

  - id: zlib-compressed-hex
    desc: zlib compressed hex pattern
    crit: component
    for: [python]
    if:
      type: string
      substr: "\\x78\\x9c"

  - id: activex-object
    desc: ActiveXObject usage (JScript/VBScript)
    crit: suspicious
    conf: 0.85
    for: [javascript, vbs, html]
    if:
      type: string
      regex: 'ActiveXObject\s*\('

  - id: batch-echo
    desc: Batch file generation via echo
    crit: suspicious
    conf: 0.8
    if:
      type: string
      regex: 'echo\s+[^>]{0,120}>>[^\n]{0,120}\.(bat|cmd)'

  - id: batch-escape
    desc: Batch special character escaping
    crit: suspicious
    conf: 0.8
    if:
      type: string
      regex: 'replace.{0,50}"\^"'

  - id: shell-namespace
    desc: Shell.Application namespace for ZIP operations
    crit: suspicious
    conf: 0.8
    if:
      type: string
      regex: 'Shell\.Application.{0,50}namespace'

  - id: msxml2-base64
    desc: MSXml2 Base64 reference
    crit: notable
    conf: 0.7
    if:
      type: string
      regex: 'MSXml2.{0,50}Base64'

  - id: bin-base64
    desc: bin.base64 reference
    crit: notable
    conf: 0.7
    if:
      type: string
      substr: bin.base64

  - id: appdata-single
    desc: '%appdata% reference'
    crit: notable
    conf: 0.6
    if:
      type: string
      substr: '%appdata%'

  - id: appdata-double
    desc: '%%appdata%% reference'
    crit: notable
    conf: 0.6
    if:
      type: string
      substr: '%%appdata%%'

composite_rules:
  # exe-to-batch builder composite
  - id: b64-encode-funcs
    desc: Base64 encoding functions
    crit: component
    for: [python]
    any:
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/data/encode/base64::encodestring-call
      - id: encodebytes-py

  - id: batch-indicators
    desc: Batch file indicators
    crit: component
    any:
      - id: echo-off-batch
      - id: echo-percent
      - id: bat-ext
      - id: cmd-ext

  - id: script-indicators
    desc: Script generation indicators
    crit: component
    any:
      - id: activex-object
      - id: micro-behaviors/host/interpreter/jscript::is-jscript
      - id: js-ext
      - id: vbs-ext

  - id: file-read-rb
    desc: File read in binary mode
    crit: component
    all:
      - id: open-paren
      - id: rb-mode

  - id: exe-to-batch
    desc: EXE to batch file converter
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    mbc: F0001
    size_max: 512000
    all:
      - id: b64-encode-funcs
      - id: batch-indicators
      - id: script-indicators
      - id: file-read-rb

  # jscript dropper builder composite
  - id: adodb-or-msxml
    desc: ADODB or MSXML reference
    crit: component
    any:
      - id: adodb-stream-str
      - id: msxml2-str

  - id: fso-or-shell
    desc: FileSystemObject or Shell.Application
    crit: component
    any:
      - id: objectives/execution/interpreter/scripting/host::filesystem-object-string
      - id: objectives/execution/activex/com::activex-shell-app

  - id: base64-or-save
    desc: Base64 or saveToFile
    crit: component
    any:
      - id: micro-behaviors/data/source/quality/import::usage-base64
      - id: objectives/execution/interpreter/script/wsh::wsh-save-to-file-literal

  - id: jscript-dropper
    desc: JScript-based dropper generator
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    mbc: F0001
    size_max: 1048576
    all:
      - id: activex-object
      - id: adodb-or-msxml
      - id: fso-or-shell
      - id: base64-or-save

  # python marshal obfuscator composite
  - id: loads-or-compressed
    desc: loads(b or zlib compressed
    crit: component
    for: [python]
    any:
      - id: loads-b
      - id: zlib-compressed-hex

  - id: python-marshal
    desc: Python marshal bytecode obfuscation
    crit: suspicious
    conf: 0.85
    for: [python]
    attack: T1027
    size_max: 5242880
    all:
      - id: marshal-loads-import
      - id: exec-paren
      - id: loads-or-compressed

  - id: msxml-base64
    desc: MSXML Base64 usage
    crit: notable
    conf: 0.7
    any:
      - id: msxml2-base64
      - id: bin-base64
