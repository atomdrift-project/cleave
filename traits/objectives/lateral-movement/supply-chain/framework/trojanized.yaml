# Trojanized Library Detection
# ATT&CK: T1195.001 (Compromise Software Dependencies and Development Tools)
# Detects patterns of legitimate libraries modified to include malicious code

traits:
  # === Popular library name indicators ===
  - id: lodash-lib
    desc: lodash library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "lodash"
      case_insensitive: true

  - id: axios-lib
    desc: axios library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "axios"
      case_insensitive: true

  - id: express-lib
    desc: express library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "express"
      case_insensitive: true

  - id: react-lib
    desc: react library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "react"
      case_insensitive: true

  - id: discord-lib
    desc: discord library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "discord"
      case_insensitive: true

  - id: telegram-lib
    desc: telegram library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "telegram"
      case_insensitive: true

  - id: winston-lib
    desc: winston library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "winston"
      case_insensitive: true

  - id: pino-lib
    desc: pino library
    crit: component
    for: [package.json]
    if:
      type: string
      word: "pino"
      case_insensitive: true

  # === Install hook indicators ===
  - id: preinstall-hook
    desc: preinstall hook
    crit: component
    for: [package.json]
    if:
      type: string
      substr: "\"preinstall\":"

  - id: postinstall-hook
    desc: postinstall hook
    crit: component
    for: [package.json]
    if:
      type: string
      substr: "\"postinstall\":"

  # === Network command indicators ===
  - id: curl-cmd
    desc: curl command
    crit: component
    for: [package.json]
    if:
      type: string
      substr: "curl "

  - id: wget-cmd
    desc: wget command
    crit: component
    for: [package.json]
    if:
      type: string
      substr: "wget "

  # === Additional requires atomic indicators ===
  - id: require-express
    desc: require express
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "require('express')"

  - id: require-lodash
    desc: require lodash
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "require('lodash')"

  - id: require-axios
    desc: require axios
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "require('axios')"

  - id: require-child-process
    desc: require child_process
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "require('child_process')"

  - id: require-os
    desc: require os
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "require('os')"

  - id: require-https
    desc: require https
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "require('https')"

  - id: require-fs
    desc: require fs
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "require('fs')"

  - id: fetch-call
    desc: fetch( call
    crit: component
    for: [javascript]
    if:
      type: string
      substr: "fetch("

  - id: request-call
    desc: .request( call
    crit: component
    for: [javascript]
    if:
      type: string
      substr: ".request("

  # === Discord library atomic indicators ===
  - id: discord-js
    desc: discord.js string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "discord.js"

  - id: discord-io
    desc: discord.io string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "discord.io"

  - id: discord-client
    desc: Discord.Client string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "Discord.Client"

  - id: discord-token
    desc: DISCORD_TOKEN string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "DISCORD_TOKEN"

  - id: dot-token
    desc: .token string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: ".token"

  - id: webhook-str
    desc: webhook string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      word: "webhook"

  - id: localstorage-str
    desc: localStorage string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "localStorage"

  - id: leveldb-str
    desc: leveldb string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      word: "leveldb"

  - id: post-method
    desc: POST string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      word: "POST"

  # === Telegram library atomic indicators ===
  - id: telegram-word
    desc: telegram word
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      word: "telegram"
      case_insensitive: true

  - id: telegraf-str
    desc: telegraf string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "telegraf"

  - id: node-telegram-bot-str
    desc: node-telegram-bot string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "node-telegram-bot"

  - id: child-process-str
    desc: child_process string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "child_process"

  - id: spawn-call
    desc: spawn( call
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "spawn("

  - id: exec-call
    desc: exec( call
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "exec("

  - id: oast-str
    desc: oast string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "oast"

  - id: webhook-site-str
    desc: webhook.site string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "webhook.site"

  # === Logging library atomic indicators ===
  - id: winston-str
    desc: winston string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "winston"

  - id: pino-str
    desc: pino string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "pino"

  - id: bunyan-str
    desc: bunyan string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "bunyan"

  - id: log4js-str
    desc: log4js string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "log4js"

  - id: spawn-word
    desc: spawn word
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      word: "spawn"

  - id: exec-word
    desc: exec word
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      word: "exec"

  - id: etc-passwd-str
    desc: /etc/passwd string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "/etc/passwd"

  # === SDK atomic indicators ===
  - id: sdk-suffix
    desc: -sdk suffix
    crit: component
    for: [javascript, typescript, package.json]
    if:
      type: string
      substr: "-sdk"

  - id: client-suffix
    desc: -client suffix
    crit: component
    for: [javascript, typescript, package.json]
    if:
      type: string
      substr: "-client"

  - id: api-suffix
    desc: -api suffix
    crit: component
    for: [javascript, typescript, package.json]
    if:
      type: string
      substr: "-api"

  - id: client-word
    desc: Client word
    crit: component
    for: [javascript, typescript, package.json]
    if:
      type: string
      word: "Client"

  - id: os-userinfo-str
    desc: os.userInfo string
    crit: component
    for: [javascript, typescript, package.json]
    if:
      type: string
      substr: "os.userInfo"

  # === Crypto library atomic indicators ===
  - id: ethers-str
    desc: ethers string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "ethers"

  - id: web3-str
    desc: web3 string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "web3"

  - id: wallet-word
    desc: wallet word
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      word: "wallet"

  - id: bitcoin-str
    desc: bitcoin string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "bitcoin"

  - id: solana-str
    desc: solana string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "solana"

  - id: privatekey-str
    desc: privateKey string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "privateKey"

  - id: mnemonic-str
    desc: mnemonic string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "mnemonic"

  - id: seedphrase-str
    desc: seedPhrase string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "seedPhrase"

  - id: keystore-str
    desc: keystore string
    crit: component
    for: [javascript, typescript]
    if:
      type: string
      substr: "keystore"

  # nanopb framework marker - legitimately used for protobuf
  - id: nanopb-framework
    desc: nanopb protobuf framework
    crit: notable
    conf: 0.9
    for: [macho, dylib]
    if:
      type: string
      substr: "nanopb"

  # Binary framework marker - detect Protobuf framework
  # GPB prefix alone is too short (3 chars) and matches in code signatures/random data
  - id: framework-binary-marker
    desc: Protobuf framework binary detected
    crit: notable
    conf: 0.95
    for: [macho, dylib]
    if:
      type: string
      substr: "GPBMessage"

composite_rules:
  # === Popular library with hooks composites ===
  - id: popular-libs
    desc: Popular library names
    crit: component
    for: [package.json]
    any:
      - id: lodash-lib
      - id: axios-lib
      - id: express-lib
      - id: react-lib
      - id: discord-lib
      - id: telegram-lib
      - id: winston-lib
      - id: pino-lib

  - id: install-hooks
    desc: NPM install hooks
    crit: component
    for: [package.json]
    any:
      - id: preinstall-hook
      - id: postinstall-hook

  - id: network-cmds
    desc: Network download commands
    crit: component
    for: [package.json]
    any:
      - id: curl-cmd
      - id: wget-cmd

  - id: popular-lib-with-hooks
    desc: Popular library with unusual install hooks
    crit: suspicious
    conf: 0.85
    attack: "T1195.001"
    for: [package.json]
    all:
      - id: popular-libs
      - id: install-hooks
      - id: network-cmds

  # === Additional requires composites ===
  - id: legit-requires
    desc: Legitimate library requires
    crit: component
    for: [javascript]
    any:
      - id: require-express
      - id: require-lodash
      - id: require-axios

  - id: suspicious-requires
    desc: Suspicious module requires
    crit: component
    for: [javascript]
    any:
      - id: require-child-process
      - id: require-os
      - id: require-https
      - id: require-fs

  - id: network-patterns
    desc: Network call patterns
    crit: component
    for: [javascript]
    any:
      - id: fetch-call
      - id: request-call

  - id: two-suspicious-requires
    desc: Two or more suspicious requires
    crit: component
    for: [javascript]
    needs: 2
    any:
      - id: require-child-process
      - id: require-os
      - id: require-https
      - id: require-fs

  - id: additional-requires
    desc: Library clone with suspicious additional requires
    crit: suspicious
    conf: 0.85
    attack: "T1195.001"
    for: [javascript]
    all:
      - id: legit-requires
      - id: two-suspicious-requires
      - id: network-patterns

  # === Discord library composites ===
  - id: discord-indicators
    desc: Discord library indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: discord-js
      - id: discord-io
      - id: discord-client

  - id: discord-tokens
    desc: Discord token indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: discord-token
      - id: dot-token

  - id: steal-indicators
    desc: Data theft indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: localstorage-str
      - id: leveldb-str

  - id: exfil-indicators
    desc: Exfiltration indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: webhook-str
      - id: steal-indicators
      - id: post-method

  - id: discord-library
    desc: Trojanized Discord library patterns
    crit: suspicious
    conf: 0.9
    attack: "T1195.001"
    mbc: "B0024"
    for: [javascript, typescript]
    all:
      - id: discord-indicators
      - id: discord-tokens
      - id: exfil-indicators

  # === Telegram library composites ===
  - id: telegram-indicators
    desc: Telegram library indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: telegram-word
      - id: telegraf-str
      - id: node-telegram-bot-str

  - id: malicious-process-calls
    desc: Malicious process execution calls
    crit: component
    for: [javascript, typescript]
    any:
      - id: child-process-str
      - id: spawn-call
      - id: exec-call

  - id: oob-exfil-indicators
    desc: Out-of-band exfiltration indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: oast-str
      - id: webhook-site-str

  - id: telegram-library
    desc: Trojanized Telegram library patterns
    crit: suspicious
    conf: 0.9
    attack: "T1195.001"
    mbc: "B0024"
    for: [javascript, typescript]
    all:
      - id: telegram-indicators
      - id: malicious-process-calls
      - id: oob-exfil-indicators

  # === Logging library composites ===
  - id: logging-indicators
    desc: Logging library indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: winston-str
      - id: pino-str
      - id: bunyan-str
      - id: log4js-str

  - id: logging-suspicious-additions
    desc: Suspicious additions for logging library
    crit: component
    for: [javascript, typescript]
    any:
      - id: child-process-str
      - id: spawn-word
      - id: exec-word
      - id: etc-passwd-str

  - id: two-logging-suspicious
    desc: Two or more suspicious additions in logging library
    crit: component
    for: [javascript, typescript]
    needs: 2
    any:
      - id: child-process-str
      - id: spawn-word
      - id: exec-word
      - id: etc-passwd-str

  - id: logging-library
    desc: Trojanized logging library patterns
    crit: suspicious
    conf: 0.85
    attack: "T1195.001"
    for: [javascript, typescript]
    all:
      - id: logging-indicators
      - id: two-logging-suspicious

  # === SDK/API client composites ===
  - id: sdk-indicators
    desc: SDK/API client indicators
    crit: component
    for: [javascript, typescript, package.json]
    any:
      - id: sdk-suffix
      - id: client-suffix
      - id: api-suffix
      - id: client-word

  - id: sdk-install-hooks
    desc: SDK install hooks
    crit: component
    for: [javascript, typescript, package.json]
    any:
      - id: preinstall-hook
      - id: postinstall-hook

  - id: sdk-suspicious-activity
    desc: SDK suspicious activity
    crit: component
    for: [javascript, typescript, package.json]
    any:
      - id: curl-cmd
      - id: wget-cmd
      - id: os-userinfo-str

  - id: sdk-client
    desc: Trojanized SDK or API client
    crit: suspicious
    conf: 0.8
    attack: "T1195.001"
    for: [javascript, typescript, package.json]
    all:
      - id: sdk-indicators
      - id: sdk-install-hooks
      - id: sdk-suspicious-activity

  # === Crypto library composites ===
  - id: crypto-library-indicators
    desc: Cryptocurrency library indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: ethers-str
      - id: web3-str
      - id: wallet-word
      - id: bitcoin-str
      - id: solana-str

  - id: key-theft-indicators
    desc: Key theft patterns
    crit: component
    for: [javascript, typescript]
    any:
      - id: privatekey-str
      - id: mnemonic-str
      - id: seedphrase-str
      - id: keystore-str

  - id: crypto-exfil-indicators
    desc: Crypto exfiltration indicators
    crit: component
    for: [javascript, typescript]
    any:
      - id: webhook-str
      - id: post-method
      - id: oast-str

  - id: crypto-library
    desc: Trojanized cryptocurrency library
    crit: suspicious
    conf: 0.9
    attack: "T1195.001"
    mbc: "B0024"
    for: [javascript, typescript]
    all:
      - id: crypto-library-indicators
      - id: key-theft-indicators
      - id: crypto-exfil-indicators

  # Trojanized framework pattern: legitimate library name + embedded payload + file deletion capability
  - id: suspicious-trojanized-framework
    desc: Likely trojanized framework with embedded payload and suspicious capabilities
    crit: suspicious
    conf: 0.9
    attack: "T1195.001"
    mbc: "B0024"
    for: [macho, dylib, elf, so]
    all:
      - id: framework-binary-marker
      - id: micro-behaviors/data/embedded/payload::lzma-magic
      - id: micro-behaviors/fs/file/delete::delete

  # Even more suspicious: trojanized framework with socket binding (network capability)
  - id: trojanized-framework-networked
    desc: Trojanized framework with network and payload capabilities
    crit: suspicious
    conf: 0.92
    attack: "T1195.001"
    mbc: "B0024"
    for: [macho, dylib, elf, so]
    all:
      - id: suspicious-trojanized-framework
      - id: micro-behaviors/communications/socket/bind::bind

  # Most suspicious: trojanized framework with C2 communication
  - id: trojanized-framework-with-c2
    desc: Trojanized framework with command & control indicators
    crit: hostile
    conf: 0.95
    attack: "T1195.001"
    mbc: "B0024"
    for: [macho, dylib, elf, so]
    all:
      - id: trojanized-framework-networked
      - id: objectives/command-and-control/infrastructure/domain::http-url-binary

  # nanopb in wallet app with iOS code injection framework
  - id: nanopb-with-ios-injection
    desc: Protobuf library with iOS code injection framework
    crit: suspicious
    conf: 0.85
    attack: "T1195.001"
    mbc: "B0024"
    for: [macho, dylib, ipa]
    all:
      - id: nanopb-framework
      - id: objectives/evasion/process/injection/runtime::cbinjection-framework
